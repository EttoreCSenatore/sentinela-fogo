[project]
name = "sentinela-backend"
version = "0.1.0"
description = "Sentinela do Fogo - wildfire IoT backend for Brazil"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiomqtt>=2.3",
    "httpx>=0.27",
    # INPE Risco de Fogo grids (NetCDF observed, LZW GeoTIFF forecast)
    "netCDF4>=1.7",
    "numpy>=2.0",
    "tifffile>=2024.8",
    "imagecodecs>=2024.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
