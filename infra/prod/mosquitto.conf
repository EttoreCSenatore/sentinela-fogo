# Production broker. Same users/ACL on both listeners.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/

# Internal, plain MQTT for the backend on the Docker network (NOT published to the host).
listener 1883

# Public MQTT over TLS for sensor nodes. Certificate = Caddy's certificate for $DOMAIN,
# copied here by mosquitto-entrypoint.sh.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
