name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags:
          - ""                                        # default: SHT31, MQ-2, flame
          - "-DTH_SENSOR_SHT31=0 -DUSE_GPS=1"         # DHT22 + GPS
          - "-DCALIBRATION_MODE=1"
    defaults:
      run:
        working-directory: firmware/esp32-node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/esp32-node/platformio.ini') }}
      - run: pip install platformio
      - run: cp src/secrets.example.h src/secrets.h
      - run: pio run
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.flags }}
