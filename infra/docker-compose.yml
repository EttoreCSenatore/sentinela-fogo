# Full self-hosted stack. First run: infra/provision.sh backend (and provision your nodes), then
#   docker compose -f infra/docker-compose.yml up -d --build
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: .env
    environment:
      SENTINELA_MQTT_HOST: mosquitto
      SENTINELA_MQTT_USERNAME: sentinela-backend
    volumes:
      - backend-data:/data
      # sites.json + recipients.json (git-ignored, personal data) are edited on the host, never baked into the image.
      - ../backend/config:/app/config:ro
    depends_on: [mosquitto]
    restart: unless-stopped

  dashboard:
    build: ../dashboard
    ports: ["${DASHBOARD_PORT:-8080}:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  mosquitto-data:
  backend-data:
