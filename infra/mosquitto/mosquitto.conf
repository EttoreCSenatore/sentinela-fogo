# Authenticated broker. Each node logs in with username = node_id and can only write its own topics (see acl).
# For internet-facing deployments add a TLS listener on 8883 (certfile/keyfile) and stop exposing 1883.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
